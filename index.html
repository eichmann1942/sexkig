<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>유산GO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 상단 헤더 -->
    <header class="header" id="mainHeader">
      <div class="logo" id="headerTitle">🏛️ 유산GO</div>
      <div class="points-badge">🪙 <span id="headerPoints">40</span>P</div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="content" id="content"></main>

    <!-- 하단 탭 바 -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" onclick="switchTab('home')">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">홈</span>
      </button>
      <button class="nav-item" onclick="switchTab('explore')">
        <span class="nav-icon">🧭</span>
        <span class="nav-label">탐험</span>
      </button>
      <button class="nav-item" onclick="switchTab('collection')">
        <span class="nav-icon">📖</span>
        <span class="nav-label">도감</span>
      </button>
      <button class="nav-item" onclick="switchTab('ranking')">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">랭킹</span>
      </button>
      <button class="nav-item" onclick="switchTab('profile')">
        <span class="nav-icon">👤</span>
        <span class="nav-label">프로필</span>
      </button>
    </nav>
  </div>

  <!-- 클럽 변경 모달 -->
  <div class="modal-overlay" id="clubModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>🏫 클럽 변경하기</h3>
        <button class="modal-close-btn" onclick="closeClubModal()">✕</button>
      </div>
      <div class="modal-body" id="clubModalList"></div>
    </div>
  </div>

  <!-- 닉네임 변경 모달 -->
  <div class="modal-overlay" id="nicknameModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>✏️ 닉네임 변경</h3>
        <button class="modal-close-btn" onclick="closeNicknameModal()">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size:12px; color:#888; margin:0 0 12px 0;">
          닉네임은 변경 후 <strong>30일 동안</strong> 다시 변경할 수 없습니다.
        </p>
        <input type="text" id="nicknameInput" class="modal-input" placeholder="새 닉네임 입력 (2~10자)" maxlength="10">
        <button class="btn-primary-orange" style="margin-top:12px;" onclick="submitNicknameChange()">변경 완료</button>
      </div>
    </div>
  </div>

  <!-- 토스트 메시지 -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
